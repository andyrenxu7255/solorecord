<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoloRecord 本体图谱</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="graph-page">
  <main class="graph-app">
    <header class="graph-toolbar">
      <div>
        <p class="eyebrow">Ontology graph</p>
        <h1 id="graphTitle">本体图谱</h1>
      </div>
      <div class="detail-actions">
        <button type="button" id="fitGraph" class="button secondary">适应窗口</button>
        <button type="button" id="refreshGraph" class="button secondary">刷新</button>
        <button type="button" id="rebuildGraph" class="button primary">重建图谱</button>
      </div>
    </header>
    <section class="graph-stage-shell">
      <svg id="graphStage" class="ontology-stage" role="img" aria-label="会议本体关系图"></svg>
      <aside id="graphInspector" class="graph-inspector">
        <h2>节点详情</h2>
        <p class="hint">点击节点或关系查看证据。</p>
      </aside>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/graph.js"></script>
</body>
</html>
